# RTAB-Map algorithm parameters are strings. ROS wrapper parameters keep native types.
subscribe_rgbd: true
publish_tf: true
approx_sync: false
wait_imu_to_init: false
wait_for_transform: 0.2
topic_queue_size: 30
sync_queue_size: 30
qos: 2
qos_camera_info: 2
Odom/Strategy: "0"
Odom/ResetCountdown: "3"
Odom/GuessMotion: "true"
Vis/MinInliers: "15"
# The mobile base is planar. Reject visual roll/pitch/z drift before it enters TF.
Reg/Force3DoF: "true"
