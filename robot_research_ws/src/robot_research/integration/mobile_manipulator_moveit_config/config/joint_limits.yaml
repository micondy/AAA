# Motion limits for the integrated mock/simulation stack.
#
# The upstream OpenArm MoveIt configuration provides velocity limits but leaves
# acceleration limits disabled. MoveIt 2's time-optimal parameterization
# requires finite acceleration limits, so this integration layer adds
# conservative values without changing the vendored upstream packages.

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  openarm_left_finger_joint1:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 5.0
