<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四路相机 · 4WIS Jazzy</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d1518;color:#eff5f2}
    *{box-sizing:border-box}body{margin:0;padding:24px;max-width:1500px;margin-inline:auto}
    header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
    h1{font-size:clamp(24px,3vw,38px);margin:0 0 6px}p{margin:0;color:#9aada8;font-size:14px}
    #summary{padding:8px 12px;border-radius:99px;background:#203138;color:#d3e9e0;font-size:13px}
    main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    figure{margin:0;background:#162329;border:1px solid #2c4348;border-radius:16px;overflow:hidden}
    .picture{aspect-ratio:4/3;display:grid;place-items:center;background:#081013;position:relative}
    img{width:100%;height:100%;object-fit:contain;display:none}
    figure.online img{display:block}figure.online .placeholder{display:none}
    .placeholder{color:#829995;font-size:14px}figcaption{padding:13px 16px;display:flex;justify-content:space-between;gap:8px}
    .name{font-weight:650}.topic{font:12px ui-monospace,monospace;color:#8fa9a3;margin-top:4px;overflow-wrap:anywhere}
    .state{font-size:12px;color:#ffbd8b}.online .state{color:#70d5a4}
    @media(max-width:760px){body{padding:14px}main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div><h1>四路相机</h1><p>4WIS · Jazzy 仿真实时 RGB 画面</p></div><span id="summary">连接中…</span></header>
  <main>
    <figure data-camera="nav_camera"><div class="picture"><span class="placeholder">等待前方相机</span><img alt="前方相机画面"></div><figcaption><div><div class="name">前方 · 定位</div><div class="topic">/sensors/nav_camera/color/image_raw</div></div><span class="state">离线</span></figcaption></figure>
    <figure data-camera="rear_camera"><div class="picture"><span class="placeholder">等待后方相机</span><img alt="后方相机画面"></div><figcaption><div><div class="name">后方</div><div class="topic">/sensors/rear_camera/color/image_raw</div></div><span class="state">离线</span></figcaption></figure>
    <figure data-camera="left_camera"><div class="picture"><span class="placeholder">等待左侧相机</span><img alt="左侧相机画面"></div><figcaption><div><div class="name">左侧</div><div class="topic">/sensors/left_camera/color/image_raw</div></div><span class="state">离线</span></figcaption></figure>
    <figure data-camera="right_camera"><div class="picture"><span class="placeholder">等待右侧相机</span><img alt="右侧相机画面"></div><figcaption><div><div class="name">右侧</div><div class="topic">/sensors/right_camera/color/image_raw</div></div><span class="state">离线</span></figcaption></figure>
  </main>
  <script>
    const cards=[...document.querySelectorAll('[data-camera]')];
    async function update(){
      try{
        const response=await fetch('/api/status',{cache:'no-store'});
        if(!response.ok)throw new Error('status');
        const status=await response.json();
        let online=0;
        for(const card of cards){
          const name=card.dataset.camera, active=Boolean(status[name]);
          card.classList.toggle('online',active);
          card.querySelector('.state').textContent=active?'实时':'离线';
          if(active){online++;card.querySelector('img').src=`/api/camera/${name}.jpg?t=${Date.now()}`}
        }
        document.querySelector('#summary').textContent=`${online} / 4 路在线`;
      }catch(error){document.querySelector('#summary').textContent='查看器连接中断'}
    }
    update();setInterval(update,500);
  </script>
</body>
</html>
