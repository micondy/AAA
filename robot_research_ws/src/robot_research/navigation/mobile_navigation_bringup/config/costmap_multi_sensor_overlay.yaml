# Four RGB-D cameras plus two 2-D LiDARs.  Topic names are the hardware
# contract documented in hardware_sensors.yaml.
local_costmap:
  local_costmap:
    ros__parameters:
      voxel_layer:
        observation_sources: front_depth rear_depth left_depth right_depth front_laser rear_laser
        front_depth:
          topic: /sensors/nav_camera/depth/color/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.80
          obstacle_min_range: 0.20
          obstacle_max_range: 3.00
          raytrace_min_range: 0.20
          raytrace_max_range: 3.50
        rear_depth:
          topic: /sensors/rear_camera/depth/color/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.80
          obstacle_min_range: 0.20
          obstacle_max_range: 3.00
          raytrace_min_range: 0.20
          raytrace_max_range: 3.50
        left_depth:
          topic: /sensors/left_camera/depth/color/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.80
          obstacle_min_range: 0.20
          obstacle_max_range: 3.00
          raytrace_min_range: 0.20
          raytrace_max_range: 3.50
        right_depth:
          topic: /sensors/right_camera/depth/color/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.80
          obstacle_min_range: 0.20
          obstacle_max_range: 3.00
          raytrace_min_range: 0.20
          raytrace_max_range: 3.50
        front_laser:
          topic: /sensors/front_lidar/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 15.0
          raytrace_min_range: 0.05
          raytrace_max_range: 16.0
        rear_laser:
          topic: /sensors/rear_lidar/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.05
          obstacle_max_range: 15.0
          raytrace_min_range: 0.05
          raytrace_max_range: 16.0

