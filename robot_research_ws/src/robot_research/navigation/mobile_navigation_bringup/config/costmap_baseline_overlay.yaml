# Isaac baseline profile.  Keep the hardware defaults in nav2.yaml conservative,
# but model the simulated 0.62 x 0.58 m chassis closely enough that narrow,
# genuinely traversable gaps are not discarded by an oversized footprint.
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.45
      vx_min: -0.15
      vy_max: 0.35
      wz_max: 0.80
      ax_max: 0.70
      ax_min: -0.70
      ay_max: 0.70
      ay_min: -0.70
      az_max: 1.20

velocity_smoother:
  ros__parameters:
    max_velocity: [0.45, 0.35, 0.80]
    min_velocity: [-0.15, -0.35, -0.80]
    max_accel: [0.70, 0.70, 1.20]
    max_decel: [-0.70, -0.70, -1.20]

local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.33, 0.31], [0.33, -0.31], [-0.33, -0.31], [-0.33, 0.31]]"
      footprint_padding: 0.02
      voxel_layer:
        front_depth:
          # Reject simulated floor/depth speckle without hiding normal curbs.
          min_obstacle_height: 0.10
      inflation_layer:
        inflation_radius: 0.10

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.33, 0.31], [0.33, -0.31], [-0.33, -0.31], [-0.33, 0.31]]"
      footprint_padding: 0.02
      obstacle_layer:
        front_depth:
          min_obstacle_height: 0.10
      inflation_layer:
        inflation_radius: 0.10

collision_monitor:
  ros__parameters:
    FrontStop:
      # Simulation depth contains ground speckle near the chassis.  Begin the
      # stop zone just beyond the padded 0.35 m nose and keep a useful 0.50 m
      # emergency look-ahead without treating the robot itself as an obstacle.
      points: "[[0.85, 0.32], [0.85, -0.32], [0.38, -0.32], [0.38, 0.32]]"
      enabled: false
    front_depth:
      min_height: 0.10
      enabled: false
