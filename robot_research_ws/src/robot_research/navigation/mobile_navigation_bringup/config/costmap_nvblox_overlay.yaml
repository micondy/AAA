# Optional N2 profile.  RTAB-Map remains the source of global free-space and
# localization; nvblox contributes short-range 3D-derived obstacle costs.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [nvblox_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: [static_layer, nvblox_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
