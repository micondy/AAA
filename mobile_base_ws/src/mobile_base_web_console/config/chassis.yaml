schema_version: 1
can:
  # 达妙 DM-J4340P 转向总线：经典 CAN 1 Mbps。
  steering: {interface: can1, bitrate: 1000000, fd: false}
  # 中菱 ZLAC8015D 行走总线：CANopen 500 kbps。
  drive: {interface: can0, bitrate: 500000, fd: false}
geometry: {wheel_radius: 0.0855, wheel_width: 0.0683, wheel_center_offset: 0.043, wheelbase: 0.419, track_width: 0.450, body_length: 0.62, body_width: 0.58, footprint_padding: 0.02}
safety:
  max_wheel_angular_velocity: 20.0
  max_wheel_angular_acceleration: 8.0
  steering_limit_deg: 90.0
  drive_alignment_tolerance_deg: 5.0
  controller_command_timeout: 0.25
  steering_feedback_timeout: 0.5
  steering_max_feedback_jump_rad: 1.0
  maintenance_max_rpm: 20.0
  maintenance_max_steering_angle_deg: 90.0
  maintenance_max_steering_step_deg: 180.0
  maintenance_max_steering_speed_rad_s: 0.15
  command_timeout: 0.5
# 2026-08-27 已确认节点/通道轮序；下列 drive.direction 仍是候选值，
# 必须在四轮架空和落地低速测试后才能视为最终方向。
wheels:
  front_left:
    label: 左前轮
    steering: {motor_id: 0x02, master_id: 0x12, direction: -1, offset_rad: 0.0, max_velocity_rad_s: 0.15}
    drive: {node_id: 5, channel: 1, direction: 1, gear_ratio: 1.0, max_motor_rpm: 1000.0}
  front_right:
    label: 右前轮
    steering: {motor_id: 0x01, master_id: 0x11, direction: -1, offset_rad: 0.0, max_velocity_rad_s: 0.15}
    drive: {node_id: 5, channel: 2, direction: -1, gear_ratio: 1.0, max_motor_rpm: 1000.0}
  rear_left:
    label: 左后轮
    steering: {motor_id: 0x04, master_id: 0x14, direction: -1, offset_rad: 0.0, max_velocity_rad_s: 0.15}
    drive: {node_id: 6, channel: 1, direction: 1, gear_ratio: 1.0, max_motor_rpm: 1000.0}
  rear_right:
    label: 右后轮
    steering: {motor_id: 0x03, master_id: 0x13, direction: -1, offset_rad: 0.0, max_velocity_rad_s: 0.15}
    drive: {node_id: 6, channel: 2, direction: -1, gear_ratio: 1.0, max_motor_rpm: 1000.0}
